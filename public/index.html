<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNO Babylon Multiplayer</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --cardW: 82px;
      --cardH: 118px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif; background: radial-gradient(circle at top, #1e293b, #020617 70%);
      color: var(--text); overflow: hidden;
    }
    #app { position: fixed; inset: 0; display: grid; grid-template-columns: 320px 1fr; }
    #sidebar {
      background: var(--panel); backdrop-filter: blur(10px); padding: 16px; overflow: auto; border-right: 1px solid rgba(148,163,184,.2);
    }
    h1,h2,h3,p { margin: 0 0 10px; }
    h1 { font-size: 22px; }
    .card-panel, .box {
      background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(148,163,184,.18); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    input[type="text"] {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(148,163,184,.25); background: #0b1220; color: var(--text); margin-bottom: 10px;
    }
    label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: 8px 0 10px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 14px; background: linear-gradient(180deg, #38bdf8, #0284c7);
      color: white; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 8px;
    }
    button.secondary { background: linear-gradient(180deg, #334155, #1e293b); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status, #roomInfo, #turnInfo, #colorInfo { color: var(--muted); font-size: 14px; line-height: 1.4; }
    #playersList { display: grid; gap: 8px; margin-top: 10px; }
    .playerRow {
      padding: 10px 12px; border-radius: 12px; background: rgba(15, 23, 42, 0.65); display: flex; justify-content: space-between; gap: 10px; align-items: center;
    }
    .you { outline: 2px solid rgba(56,189,248,.6); }
    .turn { box-shadow: 0 0 0 2px rgba(250,204,21,.7) inset; }
    .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; background: rgba(148,163,184,.15); }
    #gameWrap { position: relative; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    }
    #topHud {
      display: flex; justify-content: space-between; gap: 10px; padding: 12px; flex-wrap: wrap;
    }
    .hudBox { pointer-events: none; background: rgba(15, 23, 42, 0.66); border: 1px solid rgba(148,163,184,.2); border-radius: 16px; padding: 10px 12px; min-width: 170px; }
    #bottomHud {
      padding: 12px; display: grid; gap: 10px;
    }
    #handBar {
      pointer-events: auto; min-height: 156px; display: flex; align-items: flex-end; justify-content: center; position: relative; overflow-x: auto; overflow-y: hidden; padding: 18px 16px 8px;
      background: linear-gradient(180deg, rgba(15,23,42,0.08), rgba(15,23,42,0.72)); border-top: 1px solid rgba(148,163,184,.12);
    }
    .playCard {
      width: var(--cardW); height: var(--cardH); border-radius: 14px; position: absolute; transform-origin: bottom center; cursor: pointer;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,.35); display: grid; place-items: center; font-weight: 800; user-select: none;
      border: 3px solid rgba(255,255,255,.75);
    }
    .playCard small { font-size: 13px; opacity: .9; }
    .playCard .big { font-size: 28px; line-height: 1; }
    .playCard.playable { box-shadow: 0 0 0 3px rgba(34,197,94,.8), 0 10px 20px rgba(0,0,0,.35); }
    .playCard.selected { transform: translateY(-16px) scale(1.05) !important; }
    .backCard {
      width: var(--cardW); height: var(--cardH); border-radius: 14px; background: linear-gradient(135deg, #1d4ed8, #0f172a 55%, #dc2626); border: 3px solid rgba(255,255,255,.75);
      display: grid; place-items: center; color: white; font-weight: 900;
    }
    #actionRow { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    #actionRow button { flex: 1; min-width: 110px; margin: 0; }
    #wildModal {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); pointer-events: auto;
    }
    #wildPicker {
      background: rgba(15,23,42,.95); padding: 18px; border-radius: 18px; border: 1px solid rgba(148,163,184,.2); display: grid; gap: 10px; min-width: 240px;
    }
    .colorGrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .colorBtn { height: 54px; border-radius: 14px; border: 0; font-weight: 800; color: white; }
    .red { background: #ef4444; }
    .yellow { background: #f59e0b; }
    .green { background: #22c55e; }
    .blue { background: #3b82f6; }
    #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(15,23,42,.88); border: 1px solid rgba(148,163,184,.2); padding: 10px 14px; border-radius: 999px; display:none; pointer-events:none; }
    @media (max-width: 900px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 300px 1fr; }
      #sidebar { border-right: 0; border-bottom: 1px solid rgba(148,163,184,.2); }
      body { overflow: auto; }
      #gameWrap { min-height: calc(100vh - 300px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>UNO Babylon Multiplayer</h1>
      <div class="card-panel" id="joinPanel">
        <input id="nameInput" type="text" placeholder="Your name" maxlength="20" />
        <input id="roomInput" type="text" placeholder="Room code (leave blank to create)" maxlength="6" />
        <label><input id="stackToggle" type="checkbox" checked /> Enable draw stacking</label>
        <button id="createBtn">Create room</button>
        <button id="joinBtn" class="secondary">Join room</button>
        <div id="status">Create a room or join with a code.</div>
      </div>

      <div class="card-panel" id="lobbyPanel" style="display:none;">
        <h3>Lobby</h3>
        <div id="roomInfo"></div>
        <div style="display:grid; gap:8px; margin-top:10px;">
          <button id="startBtn">Start game</button>
          <button id="restartBtn" class="secondary">Restart game</button>
        </div>
      </div>

      <div class="box">
        <h3>Game info</h3>
        <div id="turnInfo">Waiting...</div>
        <div id="colorInfo"></div>
        <div id="penaltyInfo"></div>
      </div>

      <div class="box">
        <h3>Players</h3>
        <div id="playersList"></div>
      </div>
    </aside>

    <main id="gameWrap">
      <canvas id="renderCanvas"></canvas>
      <div id="hud">
        <div id="topHud">
          <div class="hudBox" id="deckBox">Deck: 0</div>
          <div class="hudBox" id="discardBox">Discard: 0</div>
          <div class="hudBox" id="youBox">Hand: 0</div>
        </div>
        <div id="bottomHud">
          <div id="actionRow">
            <button id="drawBtn">Draw</button>
            <button id="endBtn" class="secondary">End turn</button>
            <button id="unoBtn" class="secondary">UNO</button>
          </div>
          <div id="handBar"></div>
        </div>
      </div>
      <div id="toast"></div>
      <div id="wildModal">
        <div id="wildPicker">
          <h3>Choose color</h3>
          <div class="colorGrid">
            <button class="colorBtn red" data-color="red">Red</button>
            <button class="colorBtn yellow" data-color="yellow">Yellow</button>
            <button class="colorBtn green" data-color="green">Green</button>
            <button class="colorBtn blue" data-color="blue">Blue</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const socket = io();
    const state = { room: null, myToken: localStorage.getItem('uno_token') || '', myName: localStorage.getItem('uno_name') || 'Player', roomCode: localStorage.getItem('uno_room') || '', pendingWildCardId: null };
    const el = id => document.getElementById(id);
    const toast = (msg, ms = 1800) => { const t = el('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._tm); toast._tm = setTimeout(() => t.style.display = 'none', ms); };
    const beep = (freq = 440, duration = 0.08, type = 'sine') => {
      try {
        const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = type; o.frequency.value = freq; g.gain.value = 0.04;
        o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration); o.stop(ctx.currentTime + duration);
      } catch {}
    };

    el('nameInput').value = state.myName;
    el('roomInput').value = state.roomCode;
    const setStatus = s => el('status').textContent = s;
    const saveIdentity = (name, token) => {
      localStorage.setItem('uno_name', name);
      localStorage.setItem('uno_token', token);
      state.myName = name; state.myToken = token;
      el('nameInput').value = name;
    };

    function joinRoom(create) {
      const name = (el('nameInput').value || 'Player').trim().slice(0, 20);
      const roomCode = (el('roomInput').value || '').trim().toUpperCase();
      const stackingEnabled = el('stackToggle').checked;
      setStatus('Connecting...');
      socket.emit('joinRoom', { name, roomCode, token: state.myToken, create, stackingEnabled }, res => {
        if (!res || !res.ok) {
          setStatus(res?.error || 'Join failed.');
          return;
        }
        saveIdentity(name, res.token);
        state.roomCode = res.roomCode;
        localStorage.setItem('uno_room', res.roomCode);
        setStatus(`Joined room ${res.roomCode}`);
        el('joinPanel').style.display = 'none';
        el('lobbyPanel').style.display = 'block';
        renderLobby();
      });
    }
    el('createBtn').onclick = () => joinRoom(true);
    el('joinBtn').onclick = () => joinRoom(false);

    el('startBtn').onclick = () => socket.emit('startGame', null, res => toast(res?.error || 'Game started!'));
    el('restartBtn').onclick = () => socket.emit('restartGame', null, res => toast(res?.error || 'Game restarted!'));
    el('drawBtn').onclick = () => socket.emit('drawCard', null, res => {
      if (!res?.ok) return toast(res?.error || 'Cannot draw');
      if (res.penalty) { beep(220, 0.15); toast(`Penalty draw: ${res.drawn}`); }
      else { beep(520, 0.07); if (res.playable) toast('You drew a playable card. You can play it.'); }
    });
    el('endBtn').onclick = () => socket.emit('endTurn', null, res => { if (!res?.ok) toast(res?.error || 'Cannot end turn'); else beep(320, 0.05); });
    el('unoBtn').onclick = () => socket.emit('callUno', null, res => { if (!res?.ok) toast(res?.error || 'UNO not available'); else toast('UNO!'); beep(780, 0.08); });
    document.querySelectorAll('.colorBtn').forEach(btn => btn.onclick = () => {
      const c = btn.dataset.color;
      if (state.pendingWildCardId) {
        socket.emit('playCard', { cardId: state.pendingWildCardId, chosenColor: c }, res => {
          if (!res?.ok) toast(res?.error || 'Move failed');
          hideWildPicker();
          state.pendingWildCardId = null;
        });
      }
    });

    socket.on('state', room => {
      state.room = room;
      renderLobby();
      renderGame();
    });

    function renderLobby() {
      const room = state.room;
      if (!room) return;
      el('roomInfo').innerHTML = `Room code: <b>${room.code}</b><br>Stacking: <b>${room.stackingEnabled ? 'On' : 'Off'}</b><br>${room.started ? 'Game in progress' : 'Waiting for players'}`;
      el('startBtn').disabled = !room.canStart;
      el('restartBtn').disabled = !room.canRestart;
    }

    function colorName(c) { return c ? c[0].toUpperCase() + c.slice(1) : 'None'; }
    function isPlayable(card, room) {
      if (!room || !room.started) return false;
      const top = room.topCard;
      if (!top) return true;
      if (room.drawPenalty > 0) {
        if (!room.stackingEnabled) return false;
        if (room.drawPenalty % 4 === 0 && card.type === 'wild4') return true;
        if (room.drawPenalty % 2 === 0 && card.type === 'draw2') return true;
        return false;
      }
      if (card.type === 'wild' || card.type === 'wild4') return true;
      if (card.color && card.color === room.currentColor) return true;
      if (card.type === 'number' && top.type === 'number' && card.value === top.value) return true;
      if (card.type !== 'number' && top.type === card.type) return true;
      return false;
    }

    function cardText(card) {
      if (card.type === 'number') return String(card.value);
      if (card.type === 'skip') return 'SKIP';
      if (card.type === 'reverse') return 'REV';
      if (card.type === 'draw2') return '+2';
      if (card.type === 'wild') return 'WILD';
      if (card.type === 'wild4') return '+4';
      return card.type.toUpperCase();
    }

    function cardStyle(card, playable) {
      const base = card.type === 'wild' || card.type === 'wild4' ? '#111827' : (card.color === 'red' ? '#ef4444' : card.color === 'yellow' ? '#f59e0b' : card.color === 'green' ? '#22c55e' : '#3b82f6');
      return `background:${base}; ${playable ? 'filter:brightness(1.15);' : ''}`;
    }

    function renderGame() {
      const room = state.room;
      if (!room) return;
      const handBar = el('handBar');
      handBar.innerHTML = '';
      const myHand = room.yourHand || [];
      const n = myHand.length;
      const width = Math.min(handBar.clientWidth || 700, 920);
      const center = (n - 1) / 2;
      const spread = n > 1 ? Math.min(86, Math.max(24, width / Math.max(n, 4) / 1.35)) : 0;
      myHand.forEach((card, i) => {
        const div = document.createElement('div');
        div.className = 'playCard' + (isPlayable(card, room) && room.isYourTurn ? ' playable' : '') + (room.yourLastDrawnCardId === card.id ? ' selected' : '');
        div.style.left = `calc(50% + ${(i - center) * spread}px)`;
        div.style.bottom = `${8 + Math.abs(i - center) * 3}px`;
        div.style.transform = `translateX(-50%) rotate(${(i - center) * 4}deg)`;
        div.style.zIndex = 100 + i;
        div.style.cssText += cardStyle(card, isPlayable(card, room) && room.isYourTurn);
        div.innerHTML = `<div style="text-align:center;color:white;text-shadow:0 2px 2px rgba(0,0,0,.45)"><div class="big">${cardText(card)}</div><small>${card.color ? card.color.toUpperCase() : 'WILD'}</small></div>`;
        if (room.isYourTurn && isPlayable(card, room)) {
          div.onclick = () => playCard(card);
        }
        handBar.appendChild(div);
      });

      el('turnInfo').innerHTML = room.winner
        ? `<b>Winner:</b> ${room.winner}`
        : room.started
          ? `<b>Turn:</b> ${room.currentPlayerName || '—'} ${room.isYourTurn ? '(you)' : ''}`
          : 'Waiting for the host to start.';
      el('colorInfo').innerHTML = `<b>Current color:</b> ${colorName(room.currentColor)}<br><b>Direction:</b> ${room.direction === 1 ? 'Clockwise' : 'Counter-clockwise'}`;
      el('penaltyInfo').innerHTML = room.drawPenalty > 0 ? `<b>Draw penalty:</b> ${room.drawPenalty}` : '<b>Draw penalty:</b> none';
      el('deckBox').textContent = `Deck: ${room.deckCount}`;
      el('discardBox').textContent = `Discard: ${room.topCard ? cardText(room.topCard) : 0}`;
      el('youBox').textContent = `Hand: ${(room.yourHand || []).length}`;

      const list = el('playersList');
      list.innerHTML = '';
      room.players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'playerRow' + (p.id === room.yourId ? ' you' : '') + (p.id === room.currentPlayerId ? ' turn' : '');
        row.innerHTML = `<span>${p.name}${p.id === room.hostId ? ' <span class="pill">host</span>' : ''}${!p.connected ? ' <span class="pill">offline</span>' : ''}</span><span class="pill">${p.count} cards${p.calledUno ? ' · UNO' : ''}</span>`;
        list.appendChild(row);
      });

      el('drawBtn').disabled = !room.isYourTurn || !!room.winner || !room.started;
      el('endBtn').disabled = !room.isYourTurn || !room.yourHasDrawn || !!room.winner || !room.started;
      el('unoBtn').disabled = !room.started || (room.yourHand || []).length !== 1;
      el('wildModal').style.display = 'none';
      if (room.isYourTurn && room.started && myHand.some(c => (c.type === 'wild' || c.type === 'wild4') && isPlayable(c, room))) {
        // nothing; color will be chosen only on click
      }
      updateScene(room);
    }

    function playCard(card) {
      if (card.type === 'wild' || card.type === 'wild4') {
        state.pendingWildCardId = card.id;
        showWildPicker();
        return;
      }
      doPlay(card.id);
    }

    function doPlay(cardId, chosenColor) {
      socket.emit('playCard', { cardId, chosenColor }, res => {
        if (!res?.ok) {
          toast(res?.error || 'Move failed');
          state.pendingWildCardId = null;
          hideWildPicker();
          return;
        }
        beep(600, 0.08);
        state.pendingWildCardId = null;
        hideWildPicker();
      });
    }

    function showWildPicker() { el('wildModal').style.display = 'flex'; }
    function hideWildPicker() { el('wildModal').style.display = 'none'; }

    // Babylon scene
    const canvas = el('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener('resize', () => engine.resize());

    function createScene() {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.02, 0.05, 0.1, 1);
      const camera = new BABYLON.ArcRotateCamera('cam', Math.PI / 2, 1.15, 11, new BABYLON.Vector3(0, 0.4, 0), scene);
      camera.inputs.clear();
      const light = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 1.35;
      const dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.4, -1, -0.3), scene);
      dir.position = new BABYLON.Vector3(8, 12, 8);
      const table = BABYLON.MeshBuilder.CreateCylinder('table', { diameter: 10.2, height: 0.4, tessellation: 40 }, scene);
      table.position.y = -0.5;
      const tableMat = new BABYLON.StandardMaterial('tm', scene);
      tableMat.diffuseColor = new BABYLON.Color3(0.08, 0.45, 0.22);
      tableMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      table.material = tableMat;
      const felt = BABYLON.MeshBuilder.CreateDisc('felt', { radius: 4.4, tessellation: 32 }, scene);
      felt.rotation.x = Math.PI / 2;
      felt.position.y = -0.29;
      const feltMat = new BABYLON.StandardMaterial('fm', scene);
      feltMat.diffuseColor = new BABYLON.Color3(0.12, 0.55, 0.28);
      felt.material = feltMat;
      scene.tableMeshes = { table, felt };
      scene.cards = { local: [], drawPile: [], discard: [] };
      return scene;
    }

    function makeCardMaterial(card, back = false) {
      const tex = new BABYLON.DynamicTexture('dt_' + card.id + (back ? '_b' : ''), { width: 512, height: 768 }, scene, false);
      const ctx = tex.getContext();
      const bg = back ? '#111827' : (card.type === 'wild' || card.type === 'wild4' ? '#111827' : (card.color === 'red' ? '#ef4444' : card.color === 'yellow' ? '#f59e0b' : card.color === 'green' ? '#22c55e' : '#3b82f6'));
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 768);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 18; ctx.strokeRect(18, 18, 476, 732);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.ellipse(256, 384, 180, 260, 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
      ctx.font = 'bold 92px Arial'; ctx.fillText(back ? 'UNO' : cardText(card), 256, 300);
      ctx.font = 'bold 48px Arial'; ctx.fillText(back ? '' : (card.color ? card.color.toUpperCase() : 'WILD'), 256, 392);
      if (!back) {
        ctx.save(); ctx.translate(88, 118); ctx.rotate(-0.25); ctx.font = 'bold 52px Arial'; ctx.fillText(cardText(card), 0, 0); ctx.restore();
        ctx.save(); ctx.translate(424, 660); ctx.rotate(Math.PI - 0.25); ctx.font = 'bold 52px Arial'; ctx.fillText(cardText(card), 0, 0); ctx.restore();
      }
      tex.update();
      const mat = new BABYLON.StandardMaterial('m_' + card.id + (back ? '_b' : ''), scene);
      mat.diffuseTexture = tex;
      mat.emissiveColor = new BABYLON.Color3(0.12, 0.12, 0.12);
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      return mat;
    }

    function createCardMesh(card, back = false) {
      const mesh = BABYLON.MeshBuilder.CreateBox('card_' + card.id + (back ? '_b' : ''), { width: 1.0, height: 1.5, depth: 0.04 }, scene);
      mesh.material = makeCardMaterial(card, back);
      mesh.isPickable = !back;
      mesh.metadata = { cardId: card.id, back };
      return mesh;
    }

    function clearMeshes(list) { list.forEach(m => { if (m && !m.isDisposed()) m.dispose(); }); list.length = 0; }

    function updateScene(room) {
      if (!room) return;
      const s = scene;
      clearMeshes(s.cards.local);
      clearMeshes(s.cards.drawPile);
      clearMeshes(s.cards.discard);

      const centerY = -0.04;
      const drawCard = { id: 'draw-back', type: 'wild', color: null };
      for (let i = 0; i < Math.min(4, room.deckCount); i++) {
        const m = createCardMesh(drawCard, true);
        m.position = new BABYLON.Vector3(-2.3 + i * 0.03, centerY + i * 0.01, 0.3 + i * 0.01);
        m.rotation.y = Math.PI / 2;
        s.cards.drawPile.push(m);
      }
      if (room.topCard) {
        const m = createCardMesh(room.topCard, false);
        m.position = new BABYLON.Vector3(0.3, centerY, 0.35);
        m.rotation.y = Math.PI / 2;
        s.cards.discard.push(m);
      }
      room.yourHand.forEach((card, i) => {
        const m = createCardMesh(card, false);
        const n = room.yourHand.length;
        const center = (n - 1) / 2;
        const spread = n > 1 ? Math.min(0.65, 4.0 / Math.max(n, 4)) : 0;
        m.position = new BABYLON.Vector3((i - center) * spread, -2.7 + Math.abs(i - center) * 0.02, 4.2 + Math.abs(i - center) * 0.03);
        m.rotation = new BABYLON.Vector3(0, Math.PI, -(i - center) * 0.06);
        if (room.isYourTurn && isPlayable(card, room)) {
          m.scaling = new BABYLON.Vector3(1.03, 1.03, 1.03);
        }
        m.actionManager = new BABYLON.ActionManager(scene);
        m.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
          if (!room.isYourTurn) return;
          if (!isPlayable(card, room)) { toast('That card is not playable'); return; }
          playCard(card);
        }));
        s.cards.local.push(m);
      });
    }

    socket.on('connect', () => {
      if (!state.roomCode) setStatus('Connected. Create or join a room.');
      else el('roomInput').value = state.roomCode;
    });

    // Allow quick rejoin after refresh if token exists.
    if (state.myToken) {
      setTimeout(() => {
        const roomCode = (el('roomInput').value || '').trim().toUpperCase();
        if (roomCode) return;
      }, 500);
    }
  </script>
</body>
</html>
